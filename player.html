<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Плеер — Atlas</title>
<link rel="icon" href="icons/te-32.png">
<meta name="theme-color" content="#1b1b1f">
<style>
  /* плеер — отдельное окно, не связанное с картой (core/music-player.js); тёмный, как окно просмотра фото;
     цвета — как в core/style.css (--dark-*, --tone-my) */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    background: #1b1b1f;
    color: #e8e8ec;
    font-family: "Poppins", system-ui, sans-serif;
    font-size: 14px;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .btn {
    display: grid;
    place-items: center;
    flex: none;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 0;
    border-radius: 10px;
    background: none;
    color: #e8e8ec;
    cursor: pointer;
    text-decoration: none;
  }
  .btn:hover { background: #33333b; }
  .btn:disabled { opacity: 0.35; cursor: default; background: none; }
  .btn > svg { width: 30px; height: 30px; }

  /* шапка: название, поиск, папка, файлы, YouTube Music; в приложении — свернуть и закрыть */
  .head { display: flex; align-items: center; gap: 4px; padding: max(8px, env(safe-area-inset-top)) 8px 8px; background: #26262c; }
  .head h1 { margin: 0 6px 0 4px; font-size: 15px; font-weight: 600; }
  .find {
    flex: 1;
    min-width: 0;
    height: 36px;
    padding: 0 12px;
    border: 0;
    border-radius: 18px;
    background: #1b1b1f;
    color: #e8e8ec;
    font: inherit;
    outline: none;
  }
  .find::placeholder { color: #9a9aa5; }

  .main { min-height: 0; overflow-y: auto; padding: 12px 12px 20px; scrollbar-width: thin; }
  .hint { margin: 8px 4px; color: #9a9aa5; font-size: 13px; line-height: 1.45; }
  .access { display: block; width: 100%; margin: 0 0 8px; padding: 10px 12px; border: 0; border-radius: 10px; background: #7c4dff; color: #fff; font-weight: 600; text-align: left; cursor: pointer; }
  .dir { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; color: #9a9aa5; font-size: 12px; }
  .dir span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dir .btn { width: 28px; height: 28px; }
  .dir .btn > svg { width: 18px; height: 18px; }

  /* библиотека — альбомы обложками */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; margin-top: 8px; }
  .card { display: flex; flex-direction: column; gap: 4px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; min-width: 0; }
  .cover {
    display: grid;
    place-items: center;
    width: 100%;
    aspect-ratio: 1;
    border-radius: 10px;
    background: #2f2f37 center / cover no-repeat;
    color: #6c6c78;
    overflow: hidden;
  }
  .cover > svg { width: 40%; height: 40%; }
  .card:hover .cover { outline: 2px solid #7c4dff; }
  .card b, .card small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card b { font-size: 13px; font-weight: 600; }
  .card small { color: #9a9aa5; font-size: 12px; }
  .card.now b { color: #b49bff; }

  /* альбом: обложка, название, кнопки, песни */
  .album-top { display: flex; gap: 14px; align-items: flex-end; margin: 4px 0 12px; }
  .album-top .cover { width: 140px; flex: none; }
  .album-top h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .album-top p { margin: 0 0 8px; color: #9a9aa5; font-size: 13px; }
  .album-btns { display: flex; gap: 4px; }
  .songs { display: flex; flex-direction: column; }
  .song {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 4px 8px;
    border: 0;
    border-radius: 8px;
    background: none;
    text-align: left;
    cursor: pointer;
  }
  .song:hover { background: #2a2a31; }
  .song i { color: #9a9aa5; font-style: normal; font-size: 12px; text-align: right; }
  .song span { display: flex; flex-direction: column; min-width: 0; }
  .song b, .song small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song b { font-weight: 500; }
  .song small { color: #9a9aa5; font-size: 12px; }
  .song.now b, .song.now i { color: #b49bff; }

  /* играет сейчас — внизу */
  .bar { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; grid-template-rows: auto auto; align-items: center; gap: 4px 10px;
    padding: 8px 10px max(8px, env(safe-area-inset-bottom)); background: #26262c; }
  .bar .cover { width: 52px; grid-row: 1 / 3; cursor: pointer; border-radius: 8px; }
  .bar .meta { display: flex; flex-direction: column; min-width: 0; }
  .bar .meta b, .bar .meta small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .meta b { font-weight: 600; }
  .bar .meta small { color: #9a9aa5; font-size: 12px; }
  .ctl { display: flex; align-items: center; }
  .ctl .play { width: 48px; height: 48px; border-radius: 50%; background: #e8e8ec; color: #1b1b1f; }
  .ctl .play:hover { background: #fff; }
  .seek { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; color: #9a9aa5; font-size: 11px; font-variant-numeric: tabular-nums; }
  .seek input { flex: 1; min-width: 0; accent-color: #7c4dff; }
</style>
</head>
<body>
<header class="head">
  <h1>Плеер</h1>
  <input class="find" type="search" placeholder="Найти альбом или песню" aria-label="Найти альбом или песню">
</header>
<main class="main"></main>
<footer class="bar" hidden></footer>
<script type="module" src="core/music-player.js"></script>
</body>
</html>
